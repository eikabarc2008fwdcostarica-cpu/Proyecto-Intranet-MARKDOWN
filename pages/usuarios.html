<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios | Intranet Escolar</title>
  <link rel="stylesheet" href="../src/styles/index.css">
  <link rel="stylesheet" href="../src/styles/usuarios.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div>
        <p class="eyebrow">Administración</p>
        <h1>Gestión de Usuarios</h1>
      </div>
      <nav aria-label="Navegación secundaria">
        <a href="dashboard.html" class="button button-secondary">Volver al Panel</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <!-- Navegación por pestañas -->
    <div class="tabs-nav">
      <button class="tab-btn active" data-tab="usuarios-tab">Usuarios</button>
      <button class="tab-btn" data-tab="auditoria-tab">Auditoría y Accesos</button>
    </div>

    <!-- Pestaña de Usuarios -->
    <section id="usuarios-tab" class="tab-content">
      <div class="toolbar card">
        <div class="search-filters">
          <div class="input-group">
            <label for="searchQuery" class="visually-hidden">Buscar usuario</label>
            <input type="text" id="searchQuery" placeholder="Buscar por nombre o usuario...">
          </div>
          <div class="input-group">
            <label for="filterRole" class="visually-hidden">Rol</label>
            <select id="filterRole">
              <option value="">Todos los roles</option>
              <option value="administrador">Administrador</option>
              <option value="docente">Docente</option>
              <option value="estudiante">Estudiante</option>
              <option value="encargado">Encargado / Familia</option>
            </select>
          </div>
          <div class="input-group">
            <label for="filterStatus" class="visually-hidden">Estado</label>
            <select id="filterStatus">
              <option value="">Todos los estados</option>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>
        <button id="btnNewUser" class="button">Nuevo Usuario</button>
      </div>

      <div class="table-container card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Detalles / Asignación</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- Cargado por JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Pestaña de Auditoría -->
    <section id="auditoria-tab" class="tab-content hidden">
      <div class="grid-2">
        <div class="card">
          <h3>Historial de Cambios</h3>
          <ul class="log-list" id="changeLog">
            <!-- Cargado por JS -->
          </ul>
        </div>
        <div class="card">
          <h3>Registro de Accesos</h3>
          <ul class="log-list" id="accessLog">
            <!-- Cargado por JS -->
          </ul>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Formulario de Registro / Edición -->
  <div id="userModal" class="modal hidden">
    <div class="modal-content card">
      <div class="modal-header">
        <h2 id="modalTitle">Registrar Usuario</h2>
        <button id="closeModal" class="close-btn">&times;</button>
      </div>
      <form id="userForm">
        <input type="hidden" id="userId" name="id">
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Nombre Completo</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Juan Pérez">
          </div>
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="newUsername" name="username" required placeholder="jperez">
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required placeholder="juan.perez@escuela.com">
          </div>
          <div class="form-group">
            <label for="userRole">Rol</label>
            <select id="userRole" name="role" required>
              <option value="estudiante">Estudiante</option>
              <option value="docente">Docente</option>
              <option value="encargado">Encargado / Familia</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>
          <!-- Campos específicos dinámicos -->
          <div id="dynamicFields" class="form-group span-2">
            <!-- Insertado por JS dependiendo del rol -->
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelForm" class="button button-secondary">Cancelar</button>
          <button type="submit" class="button">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Cambiar Contraseña -->
  <div id="passwordModal" class="modal hidden">
    <div class="modal-content card max-w-sm">
      <div class="modal-header">
        <h2>Cambiar Contraseña</h2>
        <button id="closePasswordModal" class="close-btn">&times;</button>
      </div>
      <form id="passwordForm">
        <input type="hidden" id="passwordUserId" name="id">
        <div class="form-group">
          <label for="newPassword">Nueva Contraseña</label>
          <input type="password" id="newPassword" name="newPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
        </div>
        <p id="passwordError" class="form-message"></p>
        <div class="modal-actions">
          <button type="button" id="cancelPasswordForm" class="button button-secondary">Cancelar</button>
          <button type="submit" class="button">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Proyecto final · Intranet Escolar · Panel de Control de Usuarios.</p>
    </div>
  </footer>

  <script src="../src/js/usuarios.js"></script>
</body>
</html>
